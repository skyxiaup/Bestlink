name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        env:
          SFTP_HOST:     ${{ secrets.SFTP_HOST }}
          SFTP_PORT:     ${{ secrets.SFTP_PORT }}
          SFTP_USER:     ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import os, ftplib, json

          host   = os.environ["SFTP_HOST"]
          port   = int(os.environ.get("SFTP_PORT", 21))
          user   = os.environ["SFTP_USER"]
          passwd = os.environ["SFTP_PASSWORD"]

          remote_base = "/bestlinktec.com/public_html/"
          local_base  = "dist"

          exclude = {".git", ".github", ".gitignore", "CLAUDE.md",
                     "node_modules", ".astro", ".deploy-trigger",
                     "src", "public", "astro.config.mjs", "package.json",
                     "package-lock.json", "tsconfig.json", "__pycache__"}

          ftp = ftplib.FTP()
          ftp.connect(host, port)
          ftp.login(user, passwd)
          ftp.cwd(remote_base)
          ftp.set_pasv(True)

          def mkd_all(ftp, path):
              for p in path.strip("/").split("/"):
                  try: ftp.cwd(p)
                  except ftplib.error_perm:
                      ftp.mkd(p); ftp.cwd(p)

          def upload_one(local, rel):
              ftp = ftplib.FTP()
              ftp.connect(host, port, timeout=60)
              ftp.login(user, passwd)
              ftp.cwd(remote_base)
              ftp.set_pasv(True)
              parts = rel.strip("/").split("/")
              for p in parts[:-1]:
                  mkd_all(ftp, p)
              with open(local, "rb") as f:
                  ftp.storbinary(f"STOR {parts[-1]}", f)
              ftp.quit()

          for root, dirs, files in os.walk(local_base):
              for fname in sorted(files):
                  if fname in exclude:
                      continue
                  local = os.path.join(root, fname)
                  rel = os.path.relpath(local, local_base)
                  print(f"  PUT {rel}")
                  upload_one(local, rel)

          print("Deploy complete.")
          PYEOF
