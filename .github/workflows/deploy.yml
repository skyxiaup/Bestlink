name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to SiteGround via SFTP
        uses: appleboy/sftp-action@v0.2.0
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: "./"
          remote_path: "/bestlinktec.com/public_html/"
          delete: false
          exclude: |
            .git/
            .github/
            .gitignore
            CLAUDE.md
            node_modules/
            dist/
            "*.log"
